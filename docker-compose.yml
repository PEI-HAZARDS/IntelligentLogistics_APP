name: intelligentlogistics_app

services:
  gate-ui:
    build:
      context: .
      dockerfile: intelligent-logistics-frontend/Dockerfile
      args:
        VITE_MODE: gate
        VITE_API_URL: ${VITE_API_URL}
        VITE_WS_URL: ${VITE_WS_URL}
        VITE_GRAFANA_URL: ${VITE_GRAFANA_URL}
        VITE_PORT_NAME: ${VITE_PORT_NAME}
        VITE_SUBTITLE: ${VITE_SUBTITLE}
        VITE_LOGO_PATH: ${VITE_LOGO_PATH}
        VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL}
        VITE_USE_SIMULATED_GRAPH: ${VITE_USE_SIMULATED_GRAPH}
    ports:
      - "8080:80"
    environment:
      # Injected into the nginx template (envsubst) at container start.
      - API_UPSTREAM=${API_UPSTREAM}
    networks:
      - logistics-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  manager-ui:
    build:
      context: .
      dockerfile: intelligent-logistics-frontend/Dockerfile
      args:
        VITE_MODE: manager
        VITE_API_URL: ${VITE_API_URL}
        VITE_WS_URL: ${VITE_WS_URL}
        VITE_GRAFANA_URL: ${VITE_GRAFANA_URL}
        VITE_PORT_NAME: ${VITE_PORT_NAME}
        VITE_SUBTITLE: ${VITE_SUBTITLE}
        VITE_LOGO_PATH: ${VITE_LOGO_PATH}
        VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL}
        VITE_USE_SIMULATED_GRAPH: ${VITE_USE_SIMULATED_GRAPH}
    ports:
      - "8081:80"
    environment:
      - API_UPSTREAM=${API_UPSTREAM}
    networks:
      - logistics-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  api-proxy:
    build:
      context: ./infra/nginx
      dockerfile: Dockerfile
    ports:
      - "8000:80"
      - "8189:8189/udp"
    environment:
      - API_UPSTREAM=${API_UPSTREAM}
      - MEDIA_UPSTREAM=${MEDIA_UPSTREAM}
    networks:
      - logistics-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  driver-app:
    build:
      context: .
      dockerfile: intelligent-logistics-driver/Dockerfile
    ports:
      - "8082:8082"
    networks:
      - logistics-network
    environment:
      - CHOKIDAR_USEPOLLING=true
      - EXPO_USE_DEV_SERVER=true
      - REACT_NATIVE_PACKAGER_HOSTNAME=${REACT_NATIVE_PACKAGER_HOSTNAME}
      - EXPO_PUBLIC_API_URL=${EXPO_PUBLIC_API_URL}
      - EXPO_PUBLIC_WS_URL=${EXPO_PUBLIC_WS_URL}
    command: ["npm", "start", "--", "--port", "8082"]
    develop:
      watch:
        - action: sync
          path: ./intelligent-logistics-driver
          target: /app
          ignore:
            - node_modules/
        - action: sync
          path: ./packages/shared
          target: /packages/shared
    stdin_open: true
    tty: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8082 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

networks:
  logistics-network:
    driver: bridge
