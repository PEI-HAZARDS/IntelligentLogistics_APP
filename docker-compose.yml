services:
  gate-ui:
    build:
      context: ./intelligent-logistics-frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    command: npm run dev:gate -- --host
    env_file: .env
    networks:
      - logistics-network

  manager-ui:
    build:
      context: ./intelligent-logistics-frontend
      dockerfile: Dockerfile
    ports:
      - "5174:5173"
    command: npm run dev:manager -- --host
    env_file: .env
    networks:
      - logistics-network
      

  driver-app:
    build:
      context: ./intelligent-logistics-driver
    ports:
      - "8081:8081"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - EXPO_USE_DEV_SERVER=true
      - REACT_NATIVE_PACKAGER_HOSTNAME=${REACT_NATIVE_PACKAGER_HOSTNAME}
      - EXPO_PUBLIC_API_URL=${VITE_API_URL}
      - EXPO_PUBLIC_WS_URL=${VITE_WS_URL}
    develop:
      watch:
        - action: sync
          path: ./intelligent-logistics-driver
          target: /app
          ignore:
            - node_modules/
    stdin_open: true
    tty: true

networks:
  logistics-network:
    driver: bridge
