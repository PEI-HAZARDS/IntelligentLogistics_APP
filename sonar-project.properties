sonar.projectKey=PEI-HAZARDS_IntelligentLogistics_APP
sonar.organization=pei-hazards
sonar.projectName=IntelligentLogistics APP

# Analyse both sub-projects
sonar.sources=intelligent-logistics-frontend/src,intelligent-logistics-driver/src

sonar.exclusions=\
  **/node_modules/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/dist/**,\
  **/.expo/**,\
  **/android/**,\
  **/ios/**,\
  **/coverage/**

sonar.coverage.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.expo/**

sonar.typescript.tsconfigPath=intelligent-logistics-frontend/tsconfig.json
